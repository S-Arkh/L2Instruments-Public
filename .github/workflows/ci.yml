name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B tools/check_publication.py
      - run: python -B tools/check_privacy.py
      - run: python -m pip install -r pinkDream/requirements.txt
      - run: python -B -m unittest discover -s int64/tests -v
      - run: python -B -m unittest discover -s dll/tests -v
      - run: python -B -m unittest discover -s pinkDream/tools -p 'test_*.py' -v
      - run: python -m pip install pytest
      - run: python -B -m pytest test_interfaces/tests tools/tests -q
      - run: cmake -S int64 -B int64/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build int64/build --parallel 2
      - run: ctest --test-dir int64/build --output-on-failure
  windows-x86:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S int64 -B int64/build -G "Visual Studio 17 2022" -A Win32
      - run: cmake --build int64/build --config Release --parallel 2
      - run: ctest --test-dir int64/build -C Release --output-on-failure
      - run: cmake -S dll -B dll/build -G "Visual Studio 17 2022" -A Win32
      - run: cmake --build dll/build --config Release --parallel 2
      - run: cmake --build dll/build --config Release --target generate_native_uc
      - run: python -B -m unittest discover -s dll/tests -v
      - run: cmake -S gameAddWebWithD3D9/tools/renderer_probe -B gameAddWebWithD3D9/work/renderer-probe -G "Visual Studio 17 2022" -A Win32
      - run: cmake --build gameAddWebWithD3D9/work/renderer-probe --config Release --parallel 2
  desktop-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3 libssl3 zlib1g
      - run: python -m pip install -r interface_editor/requirements-release.txt
      - if: runner.os == 'Linux'
        run: |
          python -m cmake -S interface_editor -B interface_editor/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          python -m cmake -S uExplorer -B uExplorer/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - if: runner.os == 'Windows'
        run: |
          python -m cmake -S interface_editor -B interface_editor/build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m cmake -S uExplorer -B uExplorer/build -G "Visual Studio 17 2022" -A x64
      - run: python -m cmake --build interface_editor/build --config Release --parallel 2
      - run: python -m cmake --build uExplorer/build --config Release --parallel 2
      - run: python -m cmake --install uExplorer/build --config Release --prefix uExplorer
      - run: ctest --test-dir uExplorer/build -C Release --output-on-failure
      - run: python -B -m unittest discover -s uExplorer/tests -p test_launcher.py -v
      - run: python -B -m unittest discover -s uExplorer/tests -p test_package_matrix.py -v
      - name: Locate installed Linux core for CLI smoke test
        if: runner.os == 'Linux'
        run: echo "LD_LIBRARY_PATH=$PWD/uExplorer/bin:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
      - run: python -B uExplorer/tests/portable_smoke.py
      - run: python -B -m pytest -q
        working-directory: interface_editor
      - run: python -B -m pytest gameAddWebWithD3D9/tests/test_browser_schemas.py -q
      - name: Verify portable release packages
        if: runner.os == 'Windows'
        env:
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          $modules = @(Get-ChildItem interface_editor/app/_interface_core*.pyd)
          if ($modules.Count -ne 1) { throw 'Expected exactly one built native module' }
          python -B interface_editor/tools/release_windows.py --version 0.0.0-ci --revision $env:RELEASE_REVISION --module $modules[0].FullName --work "$env:RUNNER_TEMP/interface-release" --cache "$env:RUNNER_TEMP/interface-inputs"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B tools/check_privacy.py --archive "$env:RUNNER_TEMP/interface-release/publish/InterfaceEditor-0.0.0-ci-windows-x64.zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B uExplorer/tools/package_windows.py --version 0.0.0-ci --revision $env:RELEASE_REVISION --bin uExplorer/bin --out "$env:RUNNER_TEMP/uexplorer-release" --cache "$env:RUNNER_TEMP/uexplorer-inputs" --download
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B tools/check_privacy.py --archive "$env:RUNNER_TEMP/uexplorer-release/publish/uExplorer-0.0.0-ci-windows-x64.zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  browser-native:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r gameAddWebWithD3D9/requirements.txt
      - run: python gameAddWebWithD3D9/tools/fetch_dependencies.py
      - run: python -B gameAddWebWithD3D9/profiles/high-five/prepare.py --native-only
      - run: python -B gameAddWebWithD3D9/profiles/gracia/prepare.py --native-only
      - run: cmake -S gameAddWebWithD3D9/profiles/high-five -B gameAddWebWithD3D9/profiles/high-five/build -G "Visual Studio 17 2022" -A Win32
      - run: cmake --build gameAddWebWithD3D9/profiles/high-five/build --config Release --parallel 2
      - run: cmake -S gameAddWebWithD3D9/profiles/gracia -B gameAddWebWithD3D9/profiles/gracia/build-inprocess -G "Visual Studio 17 2022" -A Win32 -DGRACIA_INPROCESS_BROWSER=ON
      - run: cmake --build gameAddWebWithD3D9/profiles/gracia/build-inprocess --config Release --parallel 2
      - run: ./gameAddWebWithD3D9/profiles/high-five/build/Release/options_probe.exe
      - run: ./gameAddWebWithD3D9/profiles/gracia/build-inprocess/Release/options_probe.exe
